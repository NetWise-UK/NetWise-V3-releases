<style>
/* ============ gallery shell (dev chrome, never part of any design) ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#14171b;font-family:"Public Sans",system-ui,sans-serif;color:#c9d0d8}
img,svg,iframe{max-width:100%}
.shell{position:sticky;top:0;z-index:400;background:#14171b;border-bottom:1px solid #262c33;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.shell__brand{font:700 11.5px/1 "Public Sans";letter-spacing:.18em;color:#8b95a1;text-transform:uppercase;margin-right:2px;cursor:pointer;background:none;border:0;padding:6px 0}
.shell__brand:hover{color:#fff}
.shell__group{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.shell__label{font:700 10px/1 "Public Sans";letter-spacing:.14em;color:#5d6771;text-transform:uppercase;margin-right:2px}
.shell button.sbtn{font:500 12.5px/1 "Public Sans";padding:7px 11px;border:1px solid #333b44;background:#1c2127;color:#c9d0d8;border-radius:3px;cursor:pointer}
.shell button.sbtn:hover{background:#242b32;color:#fff}
.shell button.sbtn[aria-pressed="true"]{background:#fff;color:#14171b;border-color:#fff;font-weight:700}
.shell button:focus-visible,.shell select:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.shell select{font:500 12.5px/1 "Public Sans";padding:7px 9px;border:1px solid #333b44;background:#1c2127;color:#c9d0d8;border-radius:3px}
.shell__spacer{margin-left:auto;display:flex;gap:5px;align-items:center}
@media (max-width:760px){.shell__spacer{margin-left:0}}
body.embed .shell{display:none}
body.embed{background:#fff}

/* mobile preview drawer */
.mprev{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:500;background:#14171b;border-left:1px solid #262c33;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding:12px}
@media (prefers-reduced-motion:reduce){.mprev{transition:none}}
.mprev.open{transform:none}
.mprev__bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mprev__bar b{font:700 11px/1 "Public Sans";letter-spacing:.15em;color:#8b95a1;text-transform:uppercase}
.mprev__bar button{margin-left:auto;font:600 12.5px/1 "Public Sans";padding:7px 11px;border:1px solid #333b44;background:#1c2127;color:#c9d0d8;border-radius:3px;cursor:pointer}
.mprev__frame{flex:1;display:flex;justify-content:center;overflow:auto}
.mprev iframe{width:390px;height:100%;min-height:600px;border:1px solid #333b44;border-radius:8px;background:#fff}

/* ============ gallery landing ============ */
.gal{max-width:1200px;margin:0 auto;padding:56px 24px 90px;color:#c9d0d8}
.gal h1{font:800 clamp(30px,4.4vw,44px)/1.08 "Libre Franklin";color:#fff;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.gal .lede{font:400 16.5px/1.65 "Public Sans";color:#9aa4af;max-width:760px;margin:0 0 8px}
.gal .lede b{color:#d7dde3;font-weight:600}
.gal__hint{font:400 13.5px/1.6 "Public Sans";color:#707b86;max-width:760px;border-left:3px solid #333b44;padding-left:14px;margin:22px 0 44px}
.gal__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.gcard{background:#1a1f25;border:1px solid #2a323b;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.gcard__prev{position:relative;height:250px;overflow:hidden;background:#fff;border-bottom:1px solid #2a323b}
.gcard__prev iframe{width:1240px;max-width:none;height:1120px;transform:scale(.27);transform-origin:0 0;border:0;pointer-events:none}
.gcard__body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard h2{font:800 20px/1.15 "Libre Franklin";color:#fff;margin:0;letter-spacing:-.01em}
.gcard h2 small{display:block;font:600 10.5px/1 "Public Sans";letter-spacing:.16em;text-transform:uppercase;color:#7d8894;margin-bottom:7px}
.gcard p{font:400 13.5px/1.6 "Public Sans";color:#9aa4af;margin:0;flex:1}
.gcard__meta{font:500 11.5px/1.5 "Public Sans";color:#68727d}
.gcard__go{margin-top:10px}
.gcard__go button{font:700 13px/1 "Public Sans";padding:10px 16px;border:0;border-radius:3px;background:#fff;color:#14171b;cursor:pointer}
.gcard__go button:hover{background:#dfe5ea}
.gcard__go button:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.gal__foot{margin-top:50px;border-top:1px solid #262c33;padding-top:26px;font:400 13px/1.7 "Public Sans";color:#707b86;max-width:860px}
.gal__foot h2{font:700 12px/1 "Public Sans";letter-spacing:.15em;text-transform:uppercase;color:#9aa4af;margin:0 0 10px}
.gal__foot ul{margin:0;padding-left:18px}
.gal__foot li{margin-bottom:6px}
.gal__foot code{font:500 12px/1 ui-monospace,monospace;color:#b9c2cb;background:#20262d;padding:2px 6px;border-radius:3px}
#app:focus{outline:0}
.skip-shell{position:absolute;left:-9999px}
</style>

<div class="shell" id="shell">
  <button class="shell__brand" id="brandBtn" title="Back to gallery">NetWise V3 · Style Gallery</button>
  <div class="shell__group" role="group" aria-label="Style">
    <span class="shell__label">Style</span>

  <div class="shell__group">
    <label class="shell__label" for="pageSel">Page</label>

      <option value="home">Homepage</option>
      <option value="council">The Council (content page)</option>

    </select>
  </div>
  <div class="shell__spacer">
    <button class="sbtn" id="mprevBtn" aria-expanded="false">Mobile preview</button>
  </div>
</div>

<div class="mprev" id="mprev" aria-hidden="true">
  <div class="mprev__bar"><b>390px mobile preview</b><button id="mprevClose">Close</button></div>
  <div class="mprev__frame"><iframe id="mprevFrame" title="Mobile preview of the current page"></iframe></div>
</div>

/* ================= tiny helpers ================= */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const initials = n => n.split(" ").map(w=>w[0]).join("");

/* Illustrative "photographs": flat SVG village scenes, tinted per style so each
   direction shows its own image treatment. kind: village|bridge|show|road|meadow|hall */
function scene(kind, p){ // p = {sky, land, dark, accent, light}
  const W=800,H=520, s=p;
  let inner="";
  const hills=`<path d="M0 330 Q 200 270 420 320 T 800 300 L 800 520 L 0 520 Z" fill="${s.land}"/>
    <path d="M0 380 Q 260 330 520 375 T 800 360 L 800 520 L 0 520 Z" fill="${s.dark}" opacity=".25"/>`;
  const tree=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-6" y="30" width="12" height="34" fill="${s.dark}"/><circle cx="0" cy="8" r="34" fill="${s.dark}" opacity=".85"/><circle cx="-22" cy="20" r="22" fill="${s.dark}" opacity=".7"/><circle cx="22" cy="22" r="20" fill="${s.dark}" opacity=".7"/></g>`;
  const church=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="0" y="40" width="90" height="70" fill="${s.light}"/><rect x="0" y="40" width="90" height="70" fill="${s.dark}" opacity=".12"/><rect x="12" y="-30" width="34" height="140" fill="${s.light}"/><path d="M12 -30 L29 -62 L46 -30 Z" fill="${s.dark}"/><rect x="24" y="-14" width="10" height="18" fill="${s.dark}" opacity=".8"/><rect x="55" y="62" width="14" height="26" rx="7" fill="${s.dark}" opacity=".75"/><rect x="20" y="120" width="120" height="4" fill="${s.dark}" opacity=".3"/></g>`;
  if(kind==="village") inner = hills + church(330,160,1.15) + tree(120,300,1) + tree(660,290,1.2) + tree(560,330,.7);
  if(kind==="bridge") inner = `<rect x="0" y="360" width="800" height="160" fill="${s.accent}" opacity=".28"/>
    <path d="M0 350 Q 400 340 800 355 L 800 520 L 0 520 Z" fill="${s.accent}" opacity=".35"/>
    <path d="M110 340 Q 400 220 690 340 L 690 360 Q 400 245 110 360 Z" fill="${s.dark}"/>
    ${[...Array(12)].map((_,i)=>`<rect x="${140+i*38}" y="${300-Math.sin((i+1)/13*Math.PI)*52}" width="6" height="${60+Math.sin((i+1)/13*Math.PI)*52}" fill="${s.dark}"/>`).join("")}
    ${hills.replace(/330/,"430").replace(/320/,"420")}` + tree(80,260,.9) + tree(700,250,1);
  if(kind==="show") inner = hills + `<path d="M150 240 L 400 205 L 650 240" stroke="${s.dark}" stroke-width="4" fill="none"/>
    ${[...Array(9)].map((_,i)=>{const x=170+i*54, y=209+Math.abs(4-i)*7; return `<path d="M${x} ${y} L ${x+20} ${y} L ${x+10} ${y+26} Z" fill="${i%2? s.accent : s.light}"/>`;}).join("")}
    <g transform="translate(300 300)"><rect x="0" y="0" width="200" height="14" fill="${s.dark}"/><rect x="12" y="14" width="10" height="46" fill="${s.dark}"/><rect x="178" y="14" width="10" height="46" fill="${s.dark}"/><rect x="20" y="-34" width="70" height="34" fill="${s.light}"/><rect x="104" y="-26" width="44" height="26" fill="${s.accent}"/></g>` + tree(90,290,1) + tree(690,280,1.1);
  if(kind==="road") inner = hills + `<path d="M330 520 L 400 300 Q 405 285 420 285 L 460 285 Q 472 285 474 300 L 560 520 Z" fill="${s.dark}"/>
    <path d="M438 505 l6 -40 M448 440 l5 -34 M457 385 l4 -28 M464 340 l3 -22" stroke="${s.light}" stroke-width="7" stroke-linecap="round" fill="none"/>
    <g transform="translate(210 330)"><path d="M0 60 L30 0 L60 60 Z" fill="${s.light}"/><path d="M0 60 L30 0 L60 60 Z" fill="none" stroke="${s.accent}" stroke-width="8"/><rect x="24" y="22" width="12" height="18" fill="${s.dark}"/></g>` + tree(660,280,1.1);
  if(kind==="meadow") inner = hills + `${[...Array(16)].map((_,i)=>`<path d="M${60+i*47} ${430+ (i%3)*18} q 6 -26 0 -44" stroke="${s.dark}" stroke-width="4" fill="none" opacity=".55"/>`).join("")}
    <path d="M0 470 Q 400 440 800 465 L 800 520 L 0 520 Z" fill="${s.accent}" opacity=".3"/>
    <g transform="translate(600 250)"><rect x="0" y="26" width="8" height="70" fill="${s.dark}"/><rect x="6" y="26" width="58" height="10" fill="${s.dark}"/><rect x="8" y="34" width="52" height="6" fill="${s.dark}" opacity=".55"/></g>` + tree(140,250,1.15) + tree(420,300,.8);
  if(kind==="hall") inner = hills + `<g transform="translate(250 210)"><rect x="0" y="60" width="300" height="120" fill="${s.light}"/><rect x="0" y="60" width="300" height="120" fill="${s.dark}" opacity=".08"/><path d="M-14 62 L150 -18 L314 62 Z" fill="${s.dark}"/><rect x="130" y="112" width="40" height="68" rx="3" fill="${s.dark}" opacity=".8"/><rect x="34" y="96" width="44" height="34" fill="${s.dark}" opacity=".5"/><rect x="222" y="96" width="44" height="34" fill="${s.dark}" opacity=".5"/><rect x="138" y="30" width="24" height="26" fill="${s.light}"/></g>` + tree(110,290,1) + tree(680,280,1.05);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${s.sky}"/><circle cx="660" cy="96" r="42" fill="${s.light}" opacity=".9"/>${inner}</svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

STYLES.modern = {
label:"Modern Civic",
blurb:"Confident contemporary public-sector design — task-first homepage, flat rectangular panels, a solid navigation band and generous white space. GOV.UK rigour with municipal warmth rather than a startup look.",
meta:"Libre Franklin & Public Sans · white / cool grey / municipal blue · square corners, 1px borders",
pages,
css:`
.mcv{--blue:#164B7E;--blue-d:#103A63;--navy:#0E2A47;--ink:#172B3A;--mut:#4C5B68;--wash:#F0F3F6;--line:#D9E0E6;--signal:#D8A013;--ok:#2E6B3F;--bg:#fff;
  font-family:"Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6}
.mcv h1,.mcv h2,.mcv h3{font-family:"Libre Franklin",system-ui,sans-serif;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
.mcv a{color:var(--blue);text-underline-offset:3px}
.mcv a:hover{color:var(--blue-d)}
.mcv :focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:0}
.mcv img{display:block}
.mc-wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.mc-vh{position:absolute!important;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.mc-skip{position:absolute;left:-9999px;background:var(--signal);color:var(--ink);padding:10px 16px;font-weight:700;z-index:50}
.mc-skip:focus{left:12px;top:12px}
.mc-utility{background:var(--navy);color:#C4D3E1;font-size:13px}
.mc-utility__in{display:flex;justify-content:space-between;gap:16px;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.mc-utility a{color:#fff;text-decoration:none;margin-left:18px}
.mc-utility a:hover{text-decoration:underline}
.mc-mast{border-bottom:1px solid var(--line)}
.mc-mast__in{display:flex;align-items:center;gap:26px;padding-top:18px;padding-bottom:18px}
.mc-brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink);margin-right:auto}
.mc-mark{width:44px;height:44px;flex:none}
.mc-brand__t b{font:800 19px/1.15 "Libre Franklin";display:block;letter-spacing:-.01em}
.mc-brand__t i{font:400 12.5px/1.3 "Public Sans";font-style:normal;color:var(--mut);display:block;margin-top:3px}
.mc-search{display:flex}
.mc-search input{font:inherit;font-size:15px;padding:9px 12px;border:2px solid var(--ink);border-right:0;width:210px;background:#fff;color:var(--ink)}
.mc-search button{font:700 14px "Public Sans";background:var(--blue);color:#fff;border:2px solid var(--blue);padding:9px 15px;cursor:pointer}
.mc-search button:hover{background:var(--blue-d);border-color:var(--blue-d)}
.mc-burger{display:none;font:700 15px "Public Sans";background:var(--blue);color:#fff;border:0;padding:10px 16px;cursor:pointer}
.mc-nav{background:var(--blue)}
.mc-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.mc-nav a{display:block;color:#fff;text-decoration:none;font:600 15px/1 "Public Sans";padding:15px 15px;border-bottom:4px solid transparent;border-top:4px solid transparent}
.mc-nav a:hover{background:var(--blue-d);color:#fff}
.mc-nav a[aria-current="page"]{border-bottom-color:var(--signal);background:var(--blue-d)}
.mc-search--m{display:none}
.mc-notice{background:#FCF6E4;border-bottom:1px solid #E8D9A8;font-size:15px;padding:11px 0}
.mc-notice b{color:#7A5A00;text-transform:uppercase;font-size:12.5px;letter-spacing:.08em;margin-right:8px}
.mc-notice .mc-wrap{border-left:4px solid var(--signal);padding-left:18px}
.mc-hero{border-bottom:1px solid var(--line)}
.mc-hero__in{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding-top:52px;padding-bottom:52px}
.mc-hero__t h1{font-size:clamp(30px,4vw,44px);font-weight:800;margin-bottom:16px}
.mc-hero__t p{margin:0 0 14px;max-width:56ch}
.mc-hero__cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.mc-hero__img{width:100%;border:1px solid var(--line)}
.mc-btn{display:inline-block;background:var(--blue);color:#fff!important;text-decoration:none;font:700 15px/1 "Public Sans";padding:13px 20px;border:2px solid var(--blue)}
.mc-btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.mc-btn--ghost{background:transparent;color:var(--blue)!important;border-color:var(--blue)}
.mc-btn--ghost:hover{background:var(--wash);color:var(--blue-d)!important}
.mc-btn--w{background:#fff;color:var(--navy)!important;border-color:#fff}
.mc-btn--w:hover{background:var(--wash)}

STYLES.community = {
label:"Community",
blurb:"Warm and welcoming — rounded photo-forward cards, a village-noticeboard motif, pill navigation and a cream canvas with moss green and honey. Friendly and personable without tipping into childish.",
meta:"Bricolage Grotesque & Nunito Sans · cream / moss / honey · 14px radius, soft shadows",
pages,
css:`
.cmv{--moss:#2F6B4F;--moss-d:#245640;--ink:#22382C;--mut:#5C6B5A;--cream:#FAF6EF;--card:#FFFFFF;--honey:#E8A13C;--honey-d:#8A5A17;--clay:#C4643B;--line:#E8E0D0;
  --r:14px;--shadow:0 2px 10px rgba(46,58,40,.07);
  font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:17px;line-height:1.65}
.cmv h1,.cmv h2,.cmv h3{font-family:"Bricolage Grotesque","Nunito Sans",sans-serif;line-height:1.12;letter-spacing:-.015em;text-wrap:balance;margin:0}
.cmv a{color:var(--moss);text-underline-offset:3px}
.cmv a:hover{color:var(--moss-d)}
.cmv :focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.cmv img{display:block}
.cm-wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.cm-vh{position:absolute!important;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.cm-skip{position:absolute;left:-9999px;background:var(--honey);color:var(--ink);padding:10px 16px;font-weight:800;z-index:50;border-radius:0 0 10px 0}
.cm-skip:focus{left:0;top:0}
.cm-strip{background:var(--cream);font-size:13.5px;border-bottom:1px solid var(--line)}
.cm-strip__in{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.cm-pill{display:inline-flex;align-items:center;gap:8px;background:#EDF3EA;border:1px solid #D5E2CF;color:var(--moss-d);font-weight:700;padding:5px 13px;border-radius:999px}
.cm-pill i{width:8px;height:8px;border-radius:50%;background:var(--moss);flex:none}
.cm-strip__c a{font-weight:700}
.cm-head{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.cm-head__in{display:flex;align-items:center;gap:22px;padding-top:16px;padding-bottom:14px}
.cm-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);margin-right:auto}
.cm-mark{width:50px;height:50px;flex:none}
.cm-brand b{font:800 20px/1.1 "Bricolage Grotesque";display:block;letter-spacing:-.01em}
.cm-brand i{font:600 12.5px/1.3 "Nunito Sans";font-style:normal;color:var(--mut);display:block;margin-top:3px}
.cm-search{display:flex;background:var(--cream);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.cm-search input{font:inherit;font-size:15px;border:0;background:transparent;padding:9px 6px 9px 18px;width:180px;color:var(--ink)}
.cm-search input:focus-visible{outline-offset:-3px}
.cm-search button{border:0;background:var(--moss);color:#fff;width:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:999px;margin:3px}
.cm-search button svg{width:17px;height:17px}
.cm-search button:hover{background:var(--moss-d)}
.cm-burger{display:none;font:800 15px "Nunito Sans";background:var(--moss);color:#fff;border:0;border-radius:999px;padding:11px 18px;cursor:pointer}
.cm-nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:6px 0 12px}
.cm-nav a{display:block;text-decoration:none;font:700 15px/1 "Nunito Sans";color:var(--ink);padding:10px 15px;border-radius:999px}
.cm-nav a:hover{background:var(--cream);color:var(--moss-d)}
.cm-nav a[aria-current="page"]{background:var(--moss);color:#fff}
.cm-hero{display:grid;grid-template-columns:1fr 1.05fr;gap:46px;align-items:center;padding:52px 0 44px}
.cm-hero__t h1{font-size:clamp(32px,4.6vw,52px);font-weight:800;margin-bottom:16px}
.cm-hi{background:linear-gradient(transparent 58%, #F6D89A 58%);padding:0 2px}
.cm-hero__t p{margin:0 0 12px;max-width:54ch}
.cm-hero__cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.cm-hero__img{width:100%;border-radius:22px;box-shadow:var(--shadow)}
.cm-btn{display:inline-block;background:var(--moss);color:#fff!important;text-decoration:none;font:800 15px/1 "Nunito Sans";padding:13px 22px;border-radius:999px;border:2px solid var(--moss);cursor:pointer}
.cm-btn:hover{background:var(--moss-d);border-color:var(--moss-d)}
.cm-btn--sun{background:var(--honey);border-color:var(--honey);color:var(--ink)!important}
.cm-btn--sun:hover{background:#DE9526;border-color:#DE9526}
.cm-btn--ghost{background:transparent;color:var(--moss)!important}
.cm-btn--ghost:hover{background:#EDF3EA;color:var(--moss-d)!important}
.cm-btn--s{padding:8px 15px;font-size:13.5px}
.cm-link{font-weight:800;text-decoration:none}
.cm-link:hover{text-decoration:underline}
.cm-notice{display:flex;gap:16px;align-items:center;background:#FBF1DC;border:1px solid #EDD9AC;border-radius:var(--r);padding:16px 20px;margin:0 0 40px;position:relative}
.cm-notice__pin{width:14px;height:14px;border-radius:50%;background:var(--clay);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none}
.cm-notice b{font:800 16px "Bricolage Grotesque"}
.cm-notice p{margin:2px 0 0;font-size:14.5px;color:#6B5B33}
.cm-notice .cm-btn{margin-left:auto;flex:none}
.cm-h2{font-size:25px;font-weight:800}
.cm-quick{margin:0 0 46px}
.cm-quick__grid{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cm-quick__grid a{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;text-decoration:none;height:100%;box-shadow:var(--shadow)}
.cm-quick__grid a:hover{border-color:var(--moss);transform:translateY(-2px);transition:transform .15s ease}
@media (prefers-reduced-motion:reduce){.cm-quick__grid a:hover{transform:none}}
.cm-quick__ic{width:38px;height:38px;color:var(--moss);background:#EDF3EA;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.cm-quick__ic svg{width:21px;height:21px}
.cm-quick__grid b{font:800 17px/1.25 "Bricolage Grotesque";color:var(--ink)}
.cm-quick__d{font-size:14px;color:var(--mut)}
.cm-meetrow{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-bottom:48px;align-items:start}
.cm-meetcard{background:var(--moss);color:#fff;border-radius:20px;padding:26px 28px}
.cm-meetcard h2{font-size:22px;color:#fff;margin-bottom:10px}
.cm-meetcard__when{font-size:18px;margin:0 0 10px}
.cm-meetcard__when b{font:800 19px "Bricolage Grotesque"}
.cm-meetcard p{color:#E4EEE2;margin:0 0 12px;font-size:15.5px}
.cm-meetcard__cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cm-meetcard .cm-link{color:#fff}
.cm-meetcard--page{margin-bottom:34px}
.cm-events{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow)}
.cm-events h2{margin-bottom:12px;font-size:20px}
.cm-events ul{list-style:none;margin:0;padding:0}
.cm-events li{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:15px}
.cm-events li:last-child{border-bottom:0}
.cm-events__d{grid-row:span 2;align-self:center;background:var(--cream);border:1px solid var(--line);border-radius:10px;font:800 12.5px/1.2 "Nunito Sans";color:var(--moss-d);padding:8px 10px;text-align:center;min-width:86px}
.cm-events b{font-size:15.5px}
.cm-events small,.cm-meetlist small{color:var(--mut);font-size:13.5px}
.cm-secthead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.cm-news3,.cm-newsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cm-newsgrid{margin-bottom:34px}
.cmv section{margin-bottom:0}
.cm-news{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.cm-news img,.cm-news__noimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.cm-news__noimg{background:#EDF3EA;display:flex;align-items:center;justify-content:center}
.cm-news__noimg .cm-mark{opacity:.4;width:56px;height:56px}
.cm-news__b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.cm-news__b h2 a,.cm-news__b h3 a{color:var(--ink);font-size:18px;line-height:1.3;text-decoration:none;font-weight:800}
.cm-news__b h2 a:hover,.cm-news__b h3 a:hover{color:var(--moss-d);text-decoration:underline}
.cm-news__b time{font-size:13px;color:var(--mut);font-weight:700;order:-1}
.cm-news__b p{font-size:14.5px;color:var(--mut);margin:0}
.cm-chip{display:inline-block;font:800 11.5px/1 "Nunito Sans";color:var(--moss-d);background:#EDF3EA;padding:5px 11px;border-radius:999px;align-self:flex-start}
.cm-doclist{list-style:none;margin:0;padding:0}
.cm-doclist--2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin-bottom:46px}
.cm-doc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.cm-doc:hover{border-color:var(--moss)}
.cm-doc__ic{flex:none;width:36px;height:36px;border-radius:10px;background:#EDF3EA;color:var(--moss);display:flex;align-items:center;justify-content:center}
.cm-doc__ic svg{width:19px;height:19px}
.cm-doc__b{flex:1}

css:`
.edv{--ink:#1A1712;--mut:#6E675C;--paper:#FCFBF8;--tint:#F4F1EA;--rule:#E5E1D8;--rule-d:#1A1712;--claret:#7A2E3B;--claret-d:#5E2129;

.ed-form input,.ed-form select,.ed-form textarea{font:400 16px "Newsreader";padding:10px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink)}
.ed-form small{font:400 13px "IBM Plex Sans";color:var(--mut)}
.ed-form button{margin-top:4px}
.ed-spec--d{font-size:34px;line-height:1.2;font-weight:600;margin:0 0 10px}
.ed-swatches{display:flex;gap:14px;flex-wrap:wrap;font:500 12px "IBM Plex Sans";margin:14px 0 4px}
.ed-swatches i{display:block;width:84px;height:52px;border:1px solid var(--rule);margin-bottom:5px}
.ed-swatches code{color:var(--mut)}
.ed-btnrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ed-alert{border:1px solid var(--rule);border-left:3px solid #4A6741;background:#F2F4EC;padding:13px 18px;margin:14px 0;font-size:15.5px}
@media (max-width:960px){
  .ed-leadstory{grid-template-columns:1fr 1fr}
  .ed-brief{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule);padding:22px 0 0}
  .ed-triptych{grid-template-columns:1fr}
  .ed-col{border-bottom:1px solid var(--rule);padding-bottom:22px}
  .ed-col:last-child{border-bottom:0;padding-bottom:0}
  .ed-contactcols{grid-template-columns:1fr}
  .ed-navbar__in{justify-content:flex-start}
  .ed-navbar .ed-search{display:none}
  .ed-burger{display:block}
  .ed-nav{display:none;width:100%}
  .nav-open .ed-nav{display:block}
  .ed-nav ul{flex-direction:column;padding-bottom:10px}
  .ed-nav a{padding:12px 4px;font-size:14px}
  .ed-nav a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--claret);padding-left:12px}
  .ed-people{columns:1}
}
@media (max-width:620px){
  .ed-leadstory{grid-template-columns:1fr}
  .ed-doc{grid-template-columns:1fr;gap:4px}
  .ed-meetlist li{grid-template-columns:auto 1fr}
  .ed-meetlist a,.ed-meetlist i{grid-column:2;grid-row:auto;align-self:start}
  .ed-foot__grid{grid-template-columns:1fr}
  .ed-head__meta{justify-content:center;text-align:center}
}
`};
})();

STYLES.minimal = {
label:"Minimal",
blurb:"Premium restraint — a single typeface doing all the work, hairline dividers instead of cards, one quiet blue, and unusually generous white space. Feels expensive precisely because almost everything has been taken away.",
meta:"Instrument Sans · monochrome + one blue · hairlines, no cards, no shadows",
pages,
css:`
.mnv{--ink:#101214;--body:#33383D;--mut:#5F666D;--hair:#E7E9EB;--wash:#F7F8F9;--blue:#0F4C81;--blue-d:#0A3A63;
  font-family:"Instrument Sans",system-ui,sans-serif;color:var(--body);background:#fff;font-size:16.5px;line-height:1.7}
.mnv h1,.mnv h2,.mnv h3{color:var(--ink);font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
.mnv a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3.5px}
.mnv a:hover{color:var(--blue-d)}
.mnv :focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.mn-wrap{max-width:1060px;margin:0 auto;padding:0 26px}
.mn-wrap--copy{max-width:700px}
.mn-vh{position:absolute!important;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.mn-skip{position:absolute;left:-9999px;background:var(--ink);color:#fff;padding:10px 16px;font-weight:600;font-size:14px;z-index:50}
.mn-skip:focus{left:12px;top:12px}
.mn-head{border-bottom:1px solid var(--hair);background:#fff}
.mn-head__in{display:flex;align-items:center;gap:26px;padding-top:22px;padding-bottom:22px}
.mn-brand{font-weight:600;font-size:15.5px;color:var(--ink);text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.mn-nav ul{list-style:none;display:flex;gap:26px;margin:0;padding:0}
.mn-nav a{font-size:14px;color:var(--mut);text-decoration:none}
.mn-nav a:hover{color:var(--ink)}
.mn-nav a[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:0 14px 0 -12px var(--ink)}
.mn-burger{display:none;font:600 14px "Instrument Sans";background:none;border:1px solid var(--hair);color:var(--ink);padding:9px 16px;cursor:pointer;border-radius:2px}
.mn-page{padding:0 0 90px}
.mn-hero{padding:88px 0 56px;max-width:720px}
.mn-hero h1{font-size:clamp(30px,4vw,44px);font-weight:600;margin-bottom:22px}
.mn-hero__p{margin:0 0 30px;font-size:17.5px;color:var(--mut)}
.mn-hero__links{display:flex;gap:14px;flex-wrap:wrap}
.mn-btn{display:inline-block;background:var(--ink);color:#fff!important;text-decoration:none;font:600 14px/1 "Instrument Sans";padding:13px 22px;border-radius:2px;border:1px solid var(--ink);cursor:pointer}
.mn-btn:hover{background:#000}
.mn-btn--ghost{background:transparent;color:var(--ink)!important}
.mn-btn--ghost:hover{background:var(--wash)}
.mn-noticeline{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);padding:15px 2px;margin:0 0 26px;font-size:15px;flex-wrap:wrap}
.mn-noticeline span{font:600 11px/1.6 "Instrument Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--ink);flex:none}
.mn-noticeline p{margin:0;flex:1;min-width:240px;color:var(--mut)}
.mn-noticeline a{white-space:nowrap;font-size:14px}
.mn-noticeline--ok span{color:#2E6B3F}
.mn-sect{display:grid;grid-template-columns:220px 1fr;gap:30px;border-top:1px solid var(--hair);padding:44px 0}
.mn-sect--last{border-bottom:1px solid var(--hair)}
.mn-sect__h{font:600 12px/1.8 "Instrument Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.mn-sect__b{min-width:0}
.mn-meet{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.mn-meet b{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
.mn-meet span{color:var(--mut);font-size:16px}
.mn-meet__note{max-width:60ch;color:var(--mut);font-size:15px;margin:0 0 16px}
.mn-links{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 0;font-size:15px}
.mn-tasks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
.mn-tasks li{border-bottom:1px solid var(--hair);padding:14px 2px}
.mn-tasks a{font-weight:600;font-size:16px;text-decoration:none;color:var(--ink)}
.mn-tasks a:hover{color:var(--blue)}
.mn-tasks a::after{content:" →";color:var(--mut)}
.mn-tasks small{display:block;color:var(--mut);font-size:13.5px;margin-top:3px}
.mn-list{list-style:none;margin:0;padding:0}
.mn-list--lg .mn-row{padding:18px 2px}
.mn-row{display:flex;gap:26px;align-items:baseline;border-bottom:1px solid var(--hair);padding:14px 2px}
.mn-row time,.mn-row__t{flex:none;width:118px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mn-row__t{text-transform:uppercase;font-weight:600;font-size:11px;letter-spacing:.14em}
.mn-row__b{flex:1;min-width:0}
.mn-row__b a{font-weight:600;font-size:16px;color:var(--ink);text-decoration:none}
.mn-row__b a:hover{color:var(--blue)}
.mn-row__b small{display:block;color:var(--mut);font-size:13.5px;margin-top:3px}
.mn-row__a{color:var(--mut)}
.mn-row__m{flex:none;font-size:14px;color:var(--mut)}
.mn-crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:34px 0 0;font-size:13px}
.mn-crumbs li+li::before{content:"/";margin-right:8px;color:var(--hair)}
.mn-crumbs a{color:var(--mut);text-decoration:none}
.mn-crumbs a:hover{color:var(--ink)}
.mn-crumbs [aria-current]{color:var(--ink)}
.mn-h1{font-size:clamp(28px,3.6vw,38px);margin:18px 0 0;padding-bottom:26px}
.mn-lead{font-size:18px;color:var(--mut);max-width:62ch;margin:0 0 30px}
.mn-h2{font-size:15px;font-weight:600;letter-spacing:.01em;margin:40px 0 14px;padding-top:22px;border-top:1px solid var(--hair)}
.mn-p{margin:0 0 15px;max-width:66ch}
.mn-fine{font-size:13.5px;color:var(--mut)}
.mn-tablewrap{overflow-x:auto;margin:4px 0 8px}
.mn-table{border-collapse:collapse;width:100%;font-size:15px;min-width:440px}
.mn-table th{text-align:left;font:600 11.5px "Instrument Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--ink);padding:9px 10px 9px 0}
.mn-table td{border-bottom:1px solid var(--hair);padding:11px 10px 11px 0}
.mn-people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
.mn-people li{border-bottom:1px solid var(--hair);padding:12px 2px;display:flex;flex-direction:column}
.mn-people b{font-weight:600;color:var(--ink);font-size:15.5px}
.mn-people span{color:var(--mut);font-size:13.5px}
.mn-artmeta{font-size:13px;color:var(--mut);letter-spacing:.02em;margin:0 0 18px}
.mn-artimg{width:100%;filter:grayscale(1) contrast(1.03);margin:6px 0 28px}
.mn-quote{border-left:2px solid var(--ink);margin:28px 0;padding:4px 0 4px 24px}
.mn-quote p{font-size:20px;line-height:1.5;color:var(--ink);font-weight:500;letter-spacing:-.01em;margin:0 0 8px}
.mn-quote footer{font-size:13.5px;color:var(--mut)}
.mn-search{display:flex;border-bottom:1.5px solid var(--ink);max-width:440px;margin:0 0 18px}
.mn-search input{font:inherit;font-size:16.5px;border:0;background:transparent;padding:10px 2px;flex:1;color:var(--ink)}
.mn-search button{font:600 13px "Instrument Sans";letter-spacing:.06em;border:0;background:none;color:var(--blue);cursor:pointer;padding:10px 4px}
.mn-search button:hover{color:var(--blue-d)}
.mn-cats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:0 0 26px}
.mn-cats a{text-decoration:none;font-weight:600}
.mn-cats span{color:var(--mut);font-weight:400;font-variant-numeric:tabular-nums}
.mn-pgn ul{list-style:none;display:flex;gap:2px;margin:30px 0 0;padding:0;font-size:14px}
.mn-pgn a,.mn-pgn span{display:block;min-width:36px;text-align:center;padding:8px 9px;text-decoration:none;color:var(--mut)}
.mn-pgn a:hover{color:var(--ink)}
.mn-pgn [aria-current]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.mn-404{padding-top:70px}
.mn-404__code{font-size:100px;font-weight:600;letter-spacing:-.05em;color:var(--hair);line-height:1;margin:0}
.mn-404 .mn-h1{padding-bottom:8px}
.mn-contactgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start}
.mn-dl{margin:0;font-size:15.5px}
.mn-dl dt{font:600 11px/1 "Instrument Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:18px 0 5px}
.mn-dl dt:first-child{margin-top:0}
.mn-dl dd{margin:0;color:var(--ink)}
.mn-form__row{margin:0 0 18px;display:flex;flex-direction:column;gap:7px}
.mn-form label{font-weight:600;font-size:14px;color:var(--ink)}
.mn-form input,.mn-form select,.mn-form textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #C6CBD0;border-radius:2px;background:#fff;color:var(--ink)}
.mn-form input:hover,.mn-form select:hover,.mn-form textarea:hover{border-color:var(--ink)}
.mn-form small{color:var(--mut);font-size:13px}
.mn-spec--d{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin:0 0 10px}
.mn-swatches{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:16px 0 4px}
.mn-swatches i{display:block;width:80px;height:50px;border:1px solid var(--hair);margin-bottom:5px}
.mn-swatches code{color:var(--mut)}
.mn-btnrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mn-foot{border-top:1px solid var(--hair);padding:40px 0 34px;font-size:14px;color:var(--mut);background:#fff}
.mn-foot__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.mn-foot h2{font:600 11px/1 "Instrument Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.mn-foot p{margin:0}
.mn-foot ul{list-style:none;margin:0;padding:0}
.mn-foot li{margin-bottom:7px}
.mn-foot a{color:var(--mut)}
.mn-foot a:hover{color:var(--ink)}
.mn-foot__bar{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--hair);margin:30px 0 0;padding-top:16px;font-size:12.5px;flex-wrap:wrap}
@media (max-width:920px){
  .mn-nav{display:none}
  .mn-burger{display:block}
  .nav-open .mn-nav{display:block;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--hair);z-index:30}
  .mn-head{position:relative}
  .nav-open .mn-nav ul{flex-direction:column;gap:0;padding:8px 26px 18px}
  .nav-open .mn-nav a{display:block;padding:12px 0;font-size:16px;border-bottom:1px solid var(--hair)}
  .mn-sect{grid-template-columns:1fr;gap:14px;padding:32px 0}
  .mn-contactgrid{grid-template-columns:1fr;gap:36px}
  .mn-hero{padding:54px 0 40px}
}
@media (max-width:620px){
  .mn-tasks,.mn-people,.mn-foot__grid{grid-template-columns:1fr}
  .mn-row{flex-wrap:wrap;gap:4px 26px}
  .mn-row time{width:auto}
  .mn-row__b{flex-basis:100%;order:2}
  .mn-row__a{display:none}
}
`};
})();

STYLES.classic = {
label:"Contemporary Classic",
blurb:"For councils that want to stay recognisably traditional — crest, navy, parchment and brass on V3's existing civic palette — but executed with modern typographic precision. The reassuring option that still looks professionally designed.",
meta:"EB Garamond & Public Sans · V3's navy / parchment / brass · square corners, brass rules",
pages,
css:`
.clv{--navy:#1C2B3A;--navy-d:#14202C;--parch:#F7F4EC;--navbg:#EDE9DC;--line:#DCD6C5;--brass:#A9793D;--brass-d:#6B5228;--moss:#46614B;--brick:#9E3226;--ink:#22262B;--mut:#5B6570;--footer:#16212C;
  font-family:"Public Sans",system-ui,sans-serif;color:var(--ink);background:#FDFCF9;font-size:17px;line-height:1.65}
.clv h1,.clv h2,.clv h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:.002em;text-wrap:balance;margin:0;color:var(--navy)}
.clv a{color:var(--navy);text-decoration-color:var(--brass);text-decoration-thickness:1px;text-underline-offset:3px}
.clv a:hover{color:var(--brass-d)}
.clv :focus-visible{outline:3px solid var(--brass-d);outline-offset:2px}
.cl-wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.cl-vh{position:absolute!important;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.cl-skip{position:absolute;left:-9999px;background:var(--navy);color:#fff;padding:10px 16px;font-weight:700;font-size:14px;z-index:50}
.cl-skip:focus{left:12px;top:12px}
.cl-topbar{background:var(--parch);border-bottom:1px solid var(--line);font-size:13px}
.cl-topbar__in{display:flex;justify-content:space-between;gap:14px;padding-top:7px;padding-bottom:7px;flex-wrap:wrap}
.cl-topbar span:first-child{font-variant:small-caps;letter-spacing:.14em;color:var(--brass-d)}
.cl-mast{background:var(--parch);text-align:center;padding:30px 24px 24px}
.cl-brand{display:inline-flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none}
.cl-crest{width:52px;height:62px;display:inline-block}
.cl-brand__n{font:600 clamp(26px,3.6vw,36px)/1.1 "EB Garamond",Georgia,serif;color:var(--navy)}
.cl-brand__s{font:400 12.5px/1 "Public Sans";letter-spacing:.22em;text-transform:uppercase;color:var(--brass-d)}
.cl-flourish{display:block;width:200px;margin:18px auto 0;border-top:1px solid var(--brass);position:relative}
.cl-flourish::after{content:"";position:absolute;top:2px;left:24px;right:24px;border-top:1px solid var(--brass)}
.cl-nav{background:var(--navy)}
.cl-nav__in{display:flex;align-items:center;justify-content:center;position:relative}
.cl-nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;margin:0;padding:0}
.cl-nav a{display:block;color:#E7EAED;text-decoration:none;font:600 14px/1 "Public Sans";letter-spacing:.04em;padding:16px 14px;border-bottom:3px solid transparent;border-top:3px solid transparent}
.cl-nav a:hover{color:#fff;background:var(--navy-d)}
.cl-nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--brass)}
.cl-navsearch{display:flex;align-items:center;margin-left:16px}
.cl-navsearch input{font:400 13.5px "Public Sans";background:var(--navy-d);border:1px solid #33465A;color:#fff;padding:8px 10px;width:130px}
.cl-navsearch input::placeholder{color:#8B98A5}
.cl-navsearch button{font:700 12.5px "Public Sans";background:var(--brass);border:1px solid var(--brass);color:#1C1405;padding:8px 12px;cursor:pointer}
.cl-navsearch button:hover{background:#BE8C4C}
.cl-burger{display:none;font:700 14px "Public Sans";background:none;border:1px solid #33465A;color:#fff;padding:10px 18px;cursor:pointer;margin:8px 0}
.cl-hero{background:var(--parch);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cl-hero__in{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;padding-top:52px;padding-bottom:56px}

.cl-kicker--light{color:#D9B98B}
.cl-hero__t h1{font-size:clamp(30px,4.2vw,46px);margin-bottom:16px}
.cl-hero__t p{margin:0 0 12px;max-width:56ch}
.cl-hero__cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.cl-hero__f{border:1px solid var(--line);padding:10px;background:#fff;box-shadow:0 1px 0 var(--line)}
.cl-hero__f img{width:100%;display:block}

})();

/* ================= gallery landing + router ================= */
const ORDER = ["modern","community","editorial","minimal","classic"];
const ROOTCLS = {modern:"mcv",community:"cmv",editorial:"edv",minimal:"mnv",classic:"clv"};
const PAGES = ["home","council","news","article","meetings","documents","contact","search","notfound","components"];
const app = document.getElementById("app");
const styleTag = document.getElementById("activeStyleCSS");
const pageSel = document.getElementById("pageSel");
const isEmbed = /(^|[?&])embed=1/.test(location.search);
const selfURL = () => location.origin + location.pathname;

const state = {style:null, page:"home"}; // style null => gallery landing

function parseHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h){ state.style=null; state.page="home"; return; }
  const [s,p] = h.split("/");
  state.style = STYLES[s] ? s : null;
  state.page = PAGES.includes(p) ? p : "home";
}

function galleryHTML(){
  return `<div class="gal">
    <h1>One theme, five faces: the V3 Style Gallery</h1>
    <p class="lede">Five design directions for the NetWise V3 theme, rendered as real pages with <b>identical content</b> — the same Little Wychford Parish Council, the same news, meetings, documents and councillors throughout. Only the design changes.</p>
    <p class="lede">Every style includes ten views: homepage, content page, news listing and article, meetings, documents, contact, search, 404 and a component sheet.</p>
    <div class="gal__hint">Use the <b>Style</b> buttons and <b>Page</b> menu in the top bar to switch instantly — the same page re-renders in the new style, so direct comparison is easy. <b>Mobile preview</b> shows the current page at 390px; resizing the browser window exercises the full responsive behaviour of each design.</div>
    <div class="gal__grid">${ORDER.map(k=>{const s=STYLES[k];return `
      <article class="gcard">
        <div class="gcard__prev"><iframe src="${selfURL()}?embed=1#${k}/home" title="Preview of the ${esc(s.label)} homepage" loading="lazy" tabindex="-1"></iframe></div>
        <div class="gcard__body">
          <h2><small>Direction ${String(ORDER.indexOf(k)+1).padStart(2,"0")}</small>${esc(s.label)}</h2>
          <p>${esc(s.blurb)}</p>
          <p class="gcard__meta">${esc(s.meta)}</p>
          <p class="gcard__go"><button data-open="${k}">View ${esc(s.label)}</button></p>
        </div>
      </article>`;}).join("")}</div>
    <div class="gal__foot">
      <h2>Notes for review</h2>
      <ul>
        <li>These are <b>prototypes</b>, not theme code — nothing here touches the production V3 theme. Each direction is specified so it can be implemented through V3's existing token system (<code>nw_styles()</code> registry + colour schemes + header/hero variants).</li>
        <li>Deliberately awkward content is included: a very long news headline, an article with no image, long document titles and a draft-minutes state.</li>
        <li>Feedback in any form works — e.g. “I prefer Modern Civic”, “Editorial's typography with Community's homepage”, or notes on any single component from the component sheets.</li>
      </ul>
    </div>
  </div>`;
}

function render(focusApp){
  document.querySelectorAll(".shell [data-style]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.style===state.style)));
  pageSel.value = state.page;
  if(!state.style){
    styleTag.textContent = "";
    document.body.style.background = "#14171b";
    app.innerHTML = galleryHTML();
  } else {
    const s = STYLES[state.style];
    styleTag.textContent = s.css;
    app.innerHTML = `<div class="${ROOTCLS[state.style]}">` + s.pages[state.page]() + `</div>`;
    const m = app.firstElementChild && getComputedStyle(app.firstElementChild).backgroundColor;
    document.body.style.background = m || "#fff";
  }
  window.scrollTo(0,0);
  if(focusApp) app.focus({preventScroll:true});
  const mp = document.getElementById("mprev");
  if(mp.classList.contains("open")) syncMobilePreview();
}

function goto(style,page,push){
  state.style = style; state.page = page;
  const h = style ? `#${style}/${page}` : "#";
  if(location.hash !== h){ if(push!==false) location.hash = h; else history.replaceState(null,"",h); }
  render(true);
}

window.addEventListener("hashchange", ()=>{ parseHash(); render(false); });

document.querySelectorAll(".shell [data-style]").forEach(b=>
  b.addEventListener("click", ()=> goto(b.dataset.style, state.style ? state.page : "home")));
pageSel.addEventListener("change", ()=>{ if(!state.style) state.style = "modern"; goto(state.style, pageSel.value); });
document.getElementById("brandBtn").addEventListener("click", ()=> goto(null,"home"));

/* mobile preview drawer */
const mprev = document.getElementById("mprev"), mprevBtn = document.getElementById("mprevBtn"), mprevFrame = document.getElementById("mprevFrame");
function syncMobilePreview(){
  const target = state.style ? `#${state.style}/${state.page}` : "#modern/home";
  const want = `${selfURL()}?embed=1${target}`;
  if(mprevFrame.getAttribute("src")!==want) mprevFrame.setAttribute("src", want);
}
mprevBtn.addEventListener("click", ()=>{
  const open = !mprev.classList.contains("open");
  mprev.classList.toggle("open", open);
  mprev.setAttribute("aria-hidden", String(!open));
  mprevBtn.setAttribute("aria-expanded", String(open));
  if(open) syncMobilePreview();
});
document.getElementById("mprevClose").addEventListener("click", ()=>{
  mprev.classList.remove("open"); mprev.setAttribute("aria-hidden","true"); mprevBtn.setAttribute("aria-expanded","false"); mprevBtn.focus();
});

/* delegated interactions inside the rendered demo */
app.addEventListener("click", e=>{
  const toggle = e.target.closest("[data-menu-toggle]");
  if(toggle){
    const root = app.firstElementChild;
    const open = !root.classList.contains("nav-open");
    root.classList.toggle("nav-open", open);
    toggle.setAttribute("aria-expanded", String(open));
    return;
  }
  const open = e.target.closest("[data-open]");
  if(open){ goto(open.dataset.open,"home"); return; }
  const go = e.target.closest("[data-goto]");
  if(go){
    e.preventDefault();
    const tgt = go.dataset.goto;
    if(tgt && tgt!=="#" && PAGES.includes(tgt)) goto(state.style || "modern", tgt);
    return;
  }
  const a = e.target.closest("a[href='#']");
  if(a) e.preventDefault();
});

/* boot */
parseHash();
if(isEmbed){
  document.body.classList.add("embed");
  if(!state.style) state.style = "modern";
  render(false);
} else {
  try{
    if(!location.hash){
      const last = localStorage.getItem("v3sg-last");
      if(last){ const [s,p]=last.split("/"); if(STYLES[s]){ state.style=s; state.page=PAGES.includes(p)?p:"home"; history.replaceState(null,"",`#${s}/${p}`); } }
    }
  }catch(err){}
  render(false);
  window.addEventListener("hashchange", ()=>{ try{ if(state.style) localStorage.setItem("v3sg-last", `${state.style}/${state.page}`); }catch(err){} });
}
</script>
